name: arena-update

# AI 選股比賽：每個交易日收市後計分（多倫多時間冬令 16:45／夏令 17:45）
on:
  schedule:
    - cron: "45 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: arena-update
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Score
        env:
          ARENA_SOURCES: ${{ secrets.ARENA_SOURCES }}
        run: python arena/arena.py

      - name: Commit
        run: |
          git config user.name "stocklab-bot"
          git config user.email "stocklab-bot@users.noreply.github.com"
          git add site/data/today.json site/data/arena arena/ledger.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "arena: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
