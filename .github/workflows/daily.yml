name: daily-update

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run engine
        id: engine
        continue-on-error: true
        run: python engine/run.py

      - name: Commit data
        run: |
          git config user.name "stocklab-bot"
          git config user.email "stocklab-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Fail if engine failed
        if: steps.engine.outcome == 'failure'
        run: |
          echo "::error::Engine failed, see Run engine log"
          exit 1
